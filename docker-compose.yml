services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://prtracker:prtracker@postgres:5432/prtracker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${HOME}/.claude:/home/app/.claude
      - ${AI_REVIEW_REPO_PATH:?Set AI_REVIEW_REPO_PATH in .env to the reviewed repository checkout}:${AI_REVIEW_REPO_PATH}
    restart: unless-stopped
    networks:
      - default
      - shared_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.pr-tracker.entrypoints: "web"
      traefik.http.routers.pr-tracker.rule: "Host(`pr.torbust.work`)"
      traefik.http.services.pr-tracker.loadbalancer.server.port: "3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prtracker
      POSTGRES_PASSWORD: prtracker
      POSTGRES_DB: prtracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prtracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  shared_network:
    external: true
